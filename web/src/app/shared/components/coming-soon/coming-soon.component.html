<section class="app-page">
  <app-screen-toolbar [title]="title"></app-screen-toolbar>
  <div class="coming-soon kq-block">
    <span class="coming-soon-icon" aria-hidden="true">
      <mat-icon>{{ icon }}</mat-icon>
    </span>
    <p class="coming-soon-message">{{ message }}</p>
    <p class="coming-soon-note">This screen is being built. The venue map works today.</p>
    <a class="kq-btn kq-btn--primary" routerLink="/map">
      <mat-icon aria-hidden="true">map</mat-icon>
      <span>Open the map</span>
    </a>
  </div>
</section>
