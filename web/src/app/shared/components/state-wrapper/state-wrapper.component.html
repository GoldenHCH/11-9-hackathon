@if (errorMessage) {
  <app-alert-banner
    [message]="errorMessage"
    actionLabel="Retry"
    [dismissible]="false"
    (action)="retry.emit()"
  ></app-alert-banner>
} @else if (isLoading) {
  <div class="skeleton" aria-busy="true" aria-label="Loading">
    @for (row of skeletonRowIndexes; track row) {
      <div class="skeleton-row kq-skeleton kq-skeleton--block">
        <span class="skeleton-cube"></span>
        <span class="skeleton-lines">
          <span class="skeleton-line"></span>
          <span class="skeleton-line skeleton-line--short"></span>
        </span>
      </div>
    }
  </div>
} @else if (isEmpty) {
  <div class="empty kq-block">
    <span class="empty-icon" aria-hidden="true">
      <mat-icon>{{ emptyIcon }}</mat-icon>
    </span>
    <p class="empty-message">{{ emptyMessage }}</p>
    @if (emptyActionLabel) {
      <button type="button" class="kq-btn kq-btn--primary" (click)="emptyAction.emit()">{{ emptyActionLabel }}</button>
    }
  </div>
} @else {
  <ng-content></ng-content>
}
