version: "1"
name: kubequest-banners
description: Mirror of the KubeQuest banner rules. Reads the XP ledger for one attendee, and for each banner reached writes a 0 XP badge event (upsert that never overwrites) and appends the banner to attendees.banners. The app computes banners in code as the source of truth; badge event ids are deterministic and both writes are idempotent, so the two can run in any order without double-awarding or leaving the profile behind.
enabled: true
tags:
  - kubequest
  - banners
triggers:
  - type: manual
inputs:
  - name: attendeeId
    type: string
    required: true
steps:
  - name: ledger
    type: elasticsearch.request
    with:
      method: POST
      path: /xp_events/_search
      body:
        size: 0
        query:
          term:
            attendeeId: "{{ inputs.attendeeId }}"
        aggs:
          glass:
            filter:
              term:
                material: glass
          handshakes:
            filter:
              term:
                type: handshake
          welcomes:
            filter:
              term:
                type: welcome
  - name: observability_nerd
    type: if
    condition: "steps.ledger.output.aggregations.glass.doc_count >= 3"
    steps:
      - name: badge_observability_nerd
        type: elasticsearch.request
        with:
          method: POST
          path: "/xp_events/_update/{{ inputs.attendeeId }}:badge:observability-nerd"
          body:
            script:
              source: "ctx.op = 'noop'"
            upsert:
              id: "{{ inputs.attendeeId }}:badge:observability-nerd"
              attendeeId: "{{ inputs.attendeeId }}"
              type: badge
              xp: 0
              banner: observability-nerd
              at: "{{ execution.startedAt | date: '%s' }}000"
      - name: banner_observability_nerd
        type: elasticsearch.request
        with:
          method: POST
          path: "/attendees/_update/{{ inputs.attendeeId }}?retry_on_conflict=3"
          body:
            script:
              lang: painless
              source: "if (ctx._source.banners == null) { ctx._source.banners = new ArrayList(); } if (ctx._source.banners.contains(params.banner)) { ctx.op = 'noop'; } else { ctx._source.banners.add(params.banner); }"
              params:
                banner: observability-nerd
  - name: connector
    type: if
    condition: "steps.ledger.output.aggregations.handshakes.doc_count >= 3"
    steps:
      - name: badge_connector
        type: elasticsearch.request
        with:
          method: POST
          path: "/xp_events/_update/{{ inputs.attendeeId }}:badge:connector"
          body:
            script:
              source: "ctx.op = 'noop'"
            upsert:
              id: "{{ inputs.attendeeId }}:badge:connector"
              attendeeId: "{{ inputs.attendeeId }}"
              type: badge
              xp: 0
              banner: connector
              at: "{{ execution.startedAt | date: '%s' }}000"
      - name: banner_connector
        type: elasticsearch.request
        with:
          method: POST
          path: "/attendees/_update/{{ inputs.attendeeId }}?retry_on_conflict=3"
          body:
            script:
              lang: painless
              source: "if (ctx._source.banners == null) { ctx._source.banners = new ArrayList(); } if (ctx._source.banners.contains(params.banner)) { ctx.op = 'noop'; } else { ctx._source.banners.add(params.banner); }"
              params:
                banner: connector
  - name: welcomer
    type: if
    condition: "steps.ledger.output.aggregations.welcomes.doc_count >= 2"
    steps:
      - name: badge_welcomer
        type: elasticsearch.request
        with:
          method: POST
          path: "/xp_events/_update/{{ inputs.attendeeId }}:badge:welcomer"
          body:
            script:
              source: "ctx.op = 'noop'"
            upsert:
              id: "{{ inputs.attendeeId }}:badge:welcomer"
              attendeeId: "{{ inputs.attendeeId }}"
              type: badge
              xp: 0
              banner: welcomer
              at: "{{ execution.startedAt | date: '%s' }}000"
      - name: banner_welcomer
        type: elasticsearch.request
        with:
          method: POST
          path: "/attendees/_update/{{ inputs.attendeeId }}?retry_on_conflict=3"
          body:
            script:
              lang: painless
              source: "if (ctx._source.banners == null) { ctx._source.banners = new ArrayList(); } if (ctx._source.banners.contains(params.banner)) { ctx.op = 'noop'; } else { ctx._source.banners.add(params.banner); }"
              params:
                banner: welcomer
