version: "1"
name: kubequest-banners
description: Mirror of the KubeQuest banner rules. Reads the XP ledger for one attendee and, for each banner reached, appends it to attendees.banners with an idempotent script. It never writes to xp_events (awardXp in the app is the only ledger writer). The app treats a banner already on the profile as earned, so the two can run in any order without double-awarding.
enabled: true
tags:
  - kubequest
  - banners
triggers:
  - type: manual
inputs:
  - name: attendeeId
    type: string
    required: true
steps:
  - name: ledger
    type: elasticsearch.request
    with:
      method: POST
      path: /xp_events/_search
      body:
        size: 0
        query:
          term:
            attendeeId: "{{ inputs.attendeeId }}"
        aggs:
          glass:
            filter:
              term:
                material: glass
          handshakes:
            filter:
              term:
                type: handshake
          welcomes:
            filter:
              term:
                type: welcome
  - name: observability_nerd
    type: if
    condition: "steps.ledger.output.aggregations.glass.doc_count >= 3"
    steps:
      - name: banner_observability_nerd
        type: elasticsearch.request
        with:
          method: POST
          path: "/attendees/_update/{{ inputs.attendeeId }}?retry_on_conflict=3"
          body:
            script:
              lang: painless
              source: "if (ctx._source.banners == null) { ctx._source.banners = new ArrayList(); } if (ctx._source.banners.contains(params.banner)) { ctx.op = 'noop'; } else { ctx._source.banners.add(params.banner); }"
              params:
                banner: observability-nerd
  - name: connector
    type: if
    condition: "steps.ledger.output.aggregations.handshakes.doc_count >= 3"
    steps:
      - name: banner_connector
        type: elasticsearch.request
        with:
          method: POST
          path: "/attendees/_update/{{ inputs.attendeeId }}?retry_on_conflict=3"
          body:
            script:
              lang: painless
              source: "if (ctx._source.banners == null) { ctx._source.banners = new ArrayList(); } if (ctx._source.banners.contains(params.banner)) { ctx.op = 'noop'; } else { ctx._source.banners.add(params.banner); }"
              params:
                banner: connector
  - name: welcomer
    type: if
    condition: "steps.ledger.output.aggregations.welcomes.doc_count >= 2"
    steps:
      - name: banner_welcomer
        type: elasticsearch.request
        with:
          method: POST
          path: "/attendees/_update/{{ inputs.attendeeId }}?retry_on_conflict=3"
          body:
            script:
              lang: painless
              source: "if (ctx._source.banners == null) { ctx._source.banners = new ArrayList(); } if (ctx._source.banners.contains(params.banner)) { ctx.op = 'noop'; } else { ctx._source.banners.add(params.banner); }"
              params:
                banner: welcomer
